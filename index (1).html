<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Företagsrallyt Bil 4</title>
<style>
/* Layout: one mobile column — green day header, day tabs, a timeline of visits. Alingsås kommun profile: green + Arial. */
:root{
  --bg:#ffffff; --fg:#1f1d1d; --muted:#5a5656; --line:#cadfde; --tint:#eef5f4;
  --brand:#236151; --brand-fg:#ffffff; --brand-soft:#cadfde; --accent:#c2306c; --accent-bg:#fbeaeb;
  --card:#ffffff;
  --font:Arial, Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --fg:#eef3f1; --muted:#a9b5b1; --line:#2c3c37; --tint:#1b2522;
  --brand:#2b7562; --brand-fg:#ffffff; --brand-soft:#cfe6e0; --accent:#f07fa9; --accent-bg:#3a1f2b;
  --card:#172019; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --fg:#eef3f1; --muted:#a9b5b1; --line:#2c3c37; --tint:#1b2522;
  --brand:#2b7562; --brand-fg:#ffffff; --brand-soft:#cfe6e0; --accent:#f07fa9; --accent-bg:#3a1f2b;
  --card:#172019; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header.top{background:var(--brand);color:var(--brand-fg)}
header.top .wrap{padding-block:20px 18px;display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--brand-soft);text-transform:uppercase}
h1{margin:0;font-size:28px;line-height:1.15;text-wrap:balance}
.area{font-size:16px;opacity:.92}
nav.days{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
nav.days .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding-block:10px}
nav.days a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;border-radius:8px;text-decoration:none;color:var(--fg);background:var(--tint);font-size:15px;font-weight:700;min-height:48px}
nav.days a small{font-weight:400;font-size:12px;color:var(--muted)}
nav.days a[aria-current="page"]{background:var(--brand);color:var(--brand-fg)}
nav.days a[aria-current="page"] small{color:var(--brand-soft)}
nav.days a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:16px 32px;display:flex;flex-direction:column;gap:22px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{background:var(--tint);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fact b{font-size:16px}
.fact.wide{grid-column:1/-1}
.fact b .phone{user-select:all;font-variant-numeric:tabular-nums;font-size:inherit;letter-spacing:0;text-transform:none;color:inherit}
h2{margin:0 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h2{color:var(--brand-soft)}}
:root[data-theme="dark"] h2{color:var(--brand-soft)}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.people li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.people li div{min-width:0}
.people b{display:block}
.people .role{font-size:14px;color:var(--muted)}
.people .time{font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.stop .t{font-variant-numeric:tabular-nums}
.stop .t b{display:block;font-size:19px;color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stop .t b{color:var(--brand-soft)}}
:root[data-theme="dark"] .stop .t b{color:var(--brand-soft)}
.stop .t span{font-size:14px;color:var(--muted)}
.stop .body{min-width:0;display:flex;flex-direction:column;gap:5px}
.stop h3{margin:0;font-size:19px;line-height:1.25;text-wrap:balance}
.meta{font-size:14px;color:var(--muted)}
.desc{margin:0}
.ask{margin:0;background:var(--tint);border-radius:8px;padding:8px 10px;font-size:15px}
.ask b{color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ask b{color:var(--brand-soft)}}
:root[data-theme="dark"] .ask b{color:var(--brand-soft)}
.map{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;min-height:44px;border-radius:999px;border:1.5px solid var(--brand);color:var(--fg);text-decoration:none;font-size:14px;font-weight:700}
.map svg{width:16px;height:16px}
.map:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.badge{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent)}
.stop.now{background:var(--tint);border-radius:10px;padding-inline:10px;margin-inline:-10px;border-top-color:transparent}
.pause{padding:10px 0 10px 74px;border-top:1px solid var(--line);font-style:italic;color:var(--muted);font-size:15px}
details.prev{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
details.prev summary{cursor:pointer;font-weight:700;font-size:15px;min-height:28px}
details.prev h4{margin:10px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
details.prev ul{margin:0;padding-left:18px;font-size:15px}
details.prev li{margin-bottom:4px}
.listen{background:var(--tint);border-radius:10px;padding:16px;font-size:15px}
.ears{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ears li{display:grid;grid-template-columns:12px minmax(0,1fr);column-gap:10px;align-items:baseline}
.ears li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);grid-row:1 / span 2;align-self:start;margin-top:5px}
.ears b{font-size:16px}
.ears span{grid-column:2;font-size:14px;color:var(--muted)}
footer .wrap{padding-block:8px 28px;display:flex;flex-direction:column;align-items:center;gap:10px}
.logo{background:#ffffff;border-radius:8px;padding:10px 14px}
.logo img{display:block;width:170px;height:auto}
footer p{margin:0;font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: no-preference){.stop{transition:background .2s}}
</style>

</head>

   {s:"13.00",e:"14.00",n:"Malin Lindberg Utveckling",a:"Lendahlsgatan 13, Alingsås",h:"Malin Lindberg",d:"Samtalsterapi samt ledar-, team- och organisationsutveckling.",q:"Vilket stöd från kommunen skulle göra mest skillnad?"},
   {s:"14.15",e:"15.15",n:"Företag meddelas senare",tbd:true}
  ]}
];



const PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mins = t => { const [h,m] = t.split(".").map(Number); return h*60+m; };

function todayInfo(){
  const now = new Date();
  const parts = new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Stockholm",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(now);
  const g = k => parts.find(p => p.type === k)?.value;
  return { iso: `${g("year")}-${g("month")}-${g("day")}`, m: Number(g("hour"))*60 + Number(g("minute")) };
}

function render(id){
  const day = DAYS.find(d => d.id === id) || DAYS[0];
  const t = todayInfo();
  const isToday = t.iso === day.iso;
  let flagged = false;

  document.getElementById("dayTitle").textContent = day.title;
  document.getElementById("dayArea").textContent = "Område: " + day.area;
  document.querySelectorAll("#tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.id === day.id ? "page" : "false"));

  const people = day.people.map(([n,r,tm]) => `<li><div><b>${esc(n)}</b>${r ? `<span class="role">${esc(r)}</span>` : ""}</div><span class="time">${esc(tm)}</span></li>`).join("");

  const stops = day.stops.map(s => {
    if (s.pause) return `<li class="pause">${esc(s.pause)}</li>`;
    let badge = "", cls = "stop";
    if (isToday && !flagged && t.m < mins(s.e)) {
      flagged = true; cls += " now";
      badge = `<span class="badge">${t.m >= mins(s.s) ? "Pågår nu" : "Nästa besök"}</span>`;
    }
    if (s.tbd) return `<li class="${cls}"><div class="t"><b>${s.s}</b><span>–${s.e}</span></div><div class="body">${badge}<h3>${esc(s.n)}</h3><p class="desc meta">Samordnaren meddelar när det är klart.</p></div></li>`;
    const q = encodeURIComponent(s.map || s.a);
    return `<li class="${cls}"><div class="t"><b>${s.s}</b><span>–${s.e}</span></div><div class="body">${badge}
      <h3>${esc(s.n)}</h3>
      <div class="meta">${esc(s.a)}${s.extra ? " · " + esc(s.extra) : ""} · Värd: ${esc(s.h)}</div>
      <p class="desc">${esc(s.d)}</p>
      <p class="ask"><b>Fråga gärna:</b> ${esc(s.q)}</p>
      
      <a class="map" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">${PIN}Öppna i karta</a>
    </div></li>`;
  }).join("");

  document.getElementById("content").innerHTML = `
    <section class="facts" aria-label="Praktiskt">
      <div class="fact"><span>Samling</span><b>${esc(day.meet)}</b></div>
      <div class="fact"><span>Transport</span><b>${esc(day.transport)}</b></div>
      <div class="fact wide"><span>Samordnare</span><b>Jimmie Johansson, <span class="phone">073-414 22 38</span></b></div>
    </section>
    <section><h2>Dagens besök</h2><ol class="timeline">${stops}</ol></section>
    <section><h2>I bilen</h2><ul class="people">${people}</ul>${day.note ? `<p class="note">${esc(day.note)}</p>` : ""}</section>
    <section class="listen"><h2>Vid varje besök lyssnar vi efter</h2>
      <ul class="ears">
        <li><b>Möjligheter</b><span>Vad ser företaget framför sig?</span></li>
        <li><b>Hinder</b><span>Vad bromsar eller utmanar?</span></li>
        <li><b>Behov</b><span>Vad saknas för att lyckas?</span></li>
        <li><b>Stöd och samverkan</b><span>Vad vill de ha från kommunen?</span></li>
      </ul>
      <p class="note">Dagen avslutas med tackmejl och summering från samordnaren.</p>
    </section>`;
}

document.getElementById("tabs").innerHTML = DAYS.map(d => `<a href="#${d.id}" data-id="${d.id}">${d.short}<small>${d.date}</small></a>`).join("");

function pick(){
  const h = location.hash.slice(1);
  if (DAYS.some(d => d.id === h)) return h;
  const t = todayInfo();
  const today = DAYS.find(d => d.iso === t.iso);
  return today ? today.id : DAYS[0].id;
}
window.addEventListener("hashchange", () => { render(pick()); window.scrollTo(0,0); });
render(pick());
setInterval(() => { if (!document.querySelector("details[open]")) render(pick()); }, 60000);
</script>

</body>
